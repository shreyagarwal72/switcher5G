AutoName: Switcher 5G
Summary: 5G SA, 5G NSA, and 4G LTE Network Switcher for Android
Description: |-
  Switcher 5G lets you seamlessly manage and switch mobile network modes on Android devices.

  Features:
  - 1-Tap Network Mode Switching (5G SA / NR Only, 5G NSA / NR & LTE, 4G LTE Only)
  - Shizuku Binder IPC integration (no root required)
  - Root (su) execution support for rooted devices
  - Dual-SIM (SIM1 & SIM2) support
  - 1-Tap Home Screen App Widget
  - Quick Settings Status Bar Tiles

