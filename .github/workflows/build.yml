name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only for the release step on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # Using this action instead of ./gradlew means we don't need a
        # committed gradle-wrapper.jar for CI to work. Locally in Android
        # Studio, the wrapper jar gets generated automatically on first sync.

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: switcher5g-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Only runs when you push a tag like `v1.0.0` — attaches the APK to a
      # GitHub Release so you can download+tap-install it on your phone
      # without going through the Actions artifact UI.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
