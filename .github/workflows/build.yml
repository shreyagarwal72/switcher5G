name: Build & Release Switcher 5G APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish/update GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode or Generate Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          rm -f app/release.keystore
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias switcher5g \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass switcher5gpass \
              -keypass switcher5gpass \
              -dname "CN=Switcher5G, OU=Mobile, O=OpenSource, L=City, ST=State, C=US"
          fi

      - name: Build Debug & Release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assemble --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switcher5g-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switcher5g-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true


