name: Build & Release Switcher 5G APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish/update GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode or Generate Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          rm -f app/release.keystore
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias switcher5g \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass switcher5gpass \
              -keypass switcher5gpass \
              -dname "CN=Switcher5G, OU=Mobile, O=OpenSource, L=City, ST=State, C=US"
          fi

      - name: Build Debug & Release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assemble --no-daemon
          mkdir -p release_assets
          # Copy outputs with clear standardized naming
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" release_assets/switcher5g-release.apk
              cp "$apk" release_assets/app-release.apk
            fi
          done
          for apk in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" release_assets/switcher5g-debug.apk
              cp "$apk" release_assets/app-debug.apk
            fi
          done

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switcher5g-debug-apk
          path: release_assets/*debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switcher5g-release-apk
          path: release_assets/*release.apk
          if-no-files-found: error

      - name: Determine Release Tag & Version
        id: release_meta
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # Extract versionName from app/build.gradle.kts
            VER_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "2.0.0")
            TAG_NAME="v${VER_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Target tag: ${TAG_NAME}"

      - name: Create or Update GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.tag_name }}
          files: release_assets/*.apk
          generate_release_notes: true
          make_latest: true
