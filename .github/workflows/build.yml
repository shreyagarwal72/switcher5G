name: Build & Release Signed APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish/update GitHub Releases and commit locked signing key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure Permanent Release Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "Generating permanent release keystore to lock signature..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias switcher5g \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass switcher5gpass \
              -keypass switcher5gpass \
              -dname "CN=Switcher5G, OU=Mobile, O=OpenSource, L=City, ST=State, C=US"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release.keystore
            git commit -m "chore: lock release.keystore binary in repository to preserve APK signing signature forever"
            git push origin main || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: switcher5g-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Switcher 5G Release v1.0.0 (Initial Stable Release)"
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
